<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Remote Viewing Arena</title><style>
:root{color-scheme:dark;--bg:#0a0b12;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--tx:#eceefb;--mu:#9aa1bd;--ac:#7c6cff;--ac2:#22d3ee;--ok:#4ade80;--bad:#fb7185;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 15% -10%,rgba(124,108,255,.22),transparent 60%),radial-gradient(700px 500px at 100% 0,rgba(34,211,238,.14),transparent 55%),var(--bg);color:var(--tx);min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:18px 14px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.who{font-size:13px;color:var(--mu)} .who b{color:var(--tx)}
.hero{margin:18px 0 6px;font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.sub{color:var(--mu);font-size:14px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;backdrop-filter:blur(6px)}
h2{margin:0 0 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:700}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 18px;color:#fff;background:linear-gradient(135deg,var(--ac),#5b8cff);cursor:pointer;box-shadow:0 6px 20px rgba(124,108,255,.28)}
button:active{transform:scale(.98)}
button.ghost{background:rgba(255,255,255,.07);box-shadow:none;color:var(--tx);font-weight:600}
button:disabled{opacity:.4;box-shadow:none}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:130px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.err{color:var(--bad);font-size:14px;min-height:18px;margin-top:10px}
.note{font-size:13px;color:var(--mu);line-height:1.6}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px;word-break:break-all;color:#7f87a6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grid .im{position:relative;border-radius:14px;overflow:hidden;border:3px solid transparent;cursor:pointer;background:#151826;aspect-ratio:4/3}
.grid .im img{width:100%;height:100%;object-fit:cover;display:block}
.grid .im.picked{border-color:var(--ac);box-shadow:0 0 0 3px rgba(124,108,255,.3)}
.grid .im.tgt{border-color:var(--ok)} .grid .im.wrong{border-color:var(--bad)}
.tag{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:800;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.st b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.st span{font-size:11px;color:var(--mu)}
.big{font-size:34px;font-weight:800;letter-spacing:-.03em}
.bar{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px}
.lb{width:100%;border-collapse:collapse}
.lb td{padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums;vertical-align:middle}
.lb tr:last-child td{border:0}
.rk{width:30px;color:var(--mu);font-weight:800}
.me{background:rgba(124,108,255,.12)}
.nm{font-weight:700}
.dim{color:var(--mu);font-size:12px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(10,11,18,.85);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav button{flex:1;max-width:120px;padding:10px 4px;font-size:12px;background:transparent;box-shadow:none;color:var(--mu);font-weight:600}
.nav button.on{color:#fff;background:rgba(124,108,255,.25)}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mu);margin-right:6px}
.hit{color:var(--ok)} .miss{color:var(--bad)}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.dots i{width:12px;height:12px;border-radius:4px;background:var(--bad);opacity:.7} .dots i.h{background:var(--ok);opacity:1}
svg{display:block;width:100%;height:90px}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--mu);max-height:300px;overflow:auto;background:rgba(0,0,0,.35);padding:10px;border-radius:12px}
.hid{display:none}
</style></head><body><div class="wrap">
<div class="top"><div class="logo">Remote Viewing Arena</div><div class="who" id="who"></div></div>
<div id="view"></div>
</div>
<div class="nav hid" id="nav">
 <button data-t="play" class="on">Play</button><button data-t="board">Leaderboard</button><button data-t="all">Everyone</button><button data-t="me">My log</button><button data-t="about">How it works</button>
</div>
<script>
var TOKEN=null, S=null, B=null, TAB='play', PICK=null, RECEIPTS={}, LAST=null;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(id){return document.getElementById(id)}
function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
var API='__API_URL__';
function call(fn,args,ok){
  var e=$('err'); if(e)e.textContent='';
  function fail(m){
    if(String(m).indexOf('SIGNED_OUT')>=0){TOKEN=null;store('rv_t',null);return authView('Your session ended. Please sign in again.')}
    var e=$('err'); if(e)e.textContent=String(m).replace(/^Error: /,'');
  }
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
    .then(function(r){return r.json()})
    .then(function(j){ if(j&&j.ok){ if(ok)ok(j.result) } else fail((j&&j.error)||'Something went wrong. Try again.') })
    .catch(function(){ fail('Could not reach the server. Check your connection and try again.') });
}
function odds(p){ if(!(p<1)) return 'no evidence yet'; var x=1/p; return '1 in '+(x>=100?Math.round(x).toLocaleString():x.toFixed(1)); }
function pct(a,b){return b?(100*a/b).toFixed(1)+'%':'-'}
function meter(logE){var d=Math.max(0,logE/Math.LN10);return '<div class="bar"><i style="width:'+Math.min(100,d/5*100)+'%"></i></div>'}

/* ---- auth ---- */
function authView(msg){
  $('nav').className='nav hid'; $('who').innerHTML='';
  $('view').innerHTML='<div class="hero">Can you beat chance?</div><div class="sub">Four photos, one sealed target. Describe it first, pick second. Luck alone gets 25%. Everyone who plays lands on a public leaderboard ranked by how much evidence their record gives against pure luck.</div>'+
  '<div class="card"><h2>New player</h2><input id="nu" placeholder="Pick a player name" autocapitalize="off"><div class="row"><button onclick="doSignUp()">Create player</button></div><div class="note" style="margin-top:8px">No email and no password. You get a random recovery key to save.</div></div>'+
  '<div class="card"><h2>Returning on a new device</h2><input id="u" placeholder="Player name" autocapitalize="off"><input id="p" placeholder="Recovery key (XXXXX-XXXXX-XXXXX-XXXXX)" autocapitalize="characters"><div class="row"><button class="ghost" onclick="doLogIn()">Sign in</button></div></div><div class="err" id="err">'+esc(msg||'')+'</div>';
}
function doSignUp(){ call('signUp',[$('nu').value],function(r){TOKEN=r.token;store('rv_t',TOKEN);keyView(r)}); }
function keyView(r){
  $('view').innerHTML='<div class="hero">Save your key.</div><div class="card"><h2>Recovery key for '+esc(r.handle)+'</h2><div class="big" style="font-size:22px;word-break:break-all;font-family:ui-monospace,Menlo,monospace">'+esc(r.recoveryKey)+'</div><div class="note" style="margin-top:10px">This is shown once. It is the only way back into this player on another device or after clearing this browser. Nobody can reset it, we only store a scrambled copy, and anyone who sees it can take over your player (you can rotate it from My log). You stay signed in on this device.</div><div class="row"><button class="ghost" onclick="copyKey(\''+r.recoveryKey+'\')">Copy key</button><button onclick="boot()">I saved it, let me play</button></div></div>';
}
function rotate(){ if(!confirm('Make a new recovery key? The old key will stop working.'))return; call('rotateKey',[TOKEN],function(r){keyView({handle:S.handle,recoveryKey:r.recoveryKey})}); }
function copyKey(k){try{navigator.clipboard.writeText(k)}catch(e){}}
function doLogIn(){ call('logIn',[$('u').value,$('p').value],function(r){TOKEN=r.token;store('rv_t',TOKEN);boot()}); }
function signOut(){ var t=TOKEN; TOKEN=null; store('rv_t',null); call('logOut',[t],function(){}); authView(); }

/* ---- shell ---- */
function boot(){
  $('nav').className='nav';
  $('who').innerHTML='<b>'+esc('')+'</b>';
  refresh();
}
function refresh(cb){ call('getState',[TOKEN],function(s){S=s; $('who').innerHTML='<b>'+esc(s.handle)+'</b> &middot; <a href="#" onclick="signOut();return false" style="color:var(--mu)">sign out</a>'; draw(); if(cb)cb();}); }
function setTab(t){TAB=t;var bs=document.querySelectorAll('.nav button');for(var i=0;i<bs.length;i++)bs[i].className=(bs[i].getAttribute('data-t')===t)?'on':'';
  if(t==='board'||t==='all'){call('getBoard',[],function(b){B=b;draw()});}
  if(t==='me'){call('getLog',[TOKEN],function(l){window._log=l;draw()});}
  draw(); window.scrollTo(0,0);}
document.addEventListener('click',function(e){var t=e.target.getAttribute&&e.target.getAttribute('data-t');if(t)setTab(t)});
function draw(){
  if(!S)return;
  if(TAB==='play')return drawPlay();
  if(TAB==='board')return drawBoard();
  if(TAB==='all')return drawAll();
  if(TAB==='me')return drawMe();
  drawAbout();
}

/* ---- play ---- */
function myCard(){
  var m=S.me, d='<div class="card"><h2>Your score</h2><div class="stats"><div class="st"><b>'+m.n+'</b><span>trials</span></div><div class="st"><b>'+m.h+'</b><span>hits (luck: '+m.expected.toFixed(1)+')</span></div><div class="st"><b>'+pct(m.h,m.n)+'</b><span>hit rate (luck: 25%)</span></div></div>';
  d+='<div style="margin-top:12px" class="note">Evidence against pure luck</div><div class="big">'+(m.n?odds(m.luck):'-')+'</div><div class="note">Pure luck would get this far at most about that often. It is not the chance you have a gift.</div>'+meter(m.logE);
  d+='<div class="note" style="margin-top:6px">'+(S.rank?('Rank '+S.rank+' of '+S.players+'. '):'')+'Crowd-adjusted ('+S.players+' players): '+(m.n?odds(m.luckAdj):'-')+'.</div>';
  if(S.series.length){d+='<div class="dots">'+S.series.slice(-60).map(function(x){return '<i class="'+(x?'h':'')+'"></i>'}).join('')+'</div>';}
  return d+'</div>';
}
function drawPlay(){
  var a=S.active, v=$('view'), h='';
  if(!a){
    h='<div class="hero">Ready when you are.</div><div class="card"><h2>Trial '+(S.me.n+S.aborted+1)+'</h2><div class="note">The server seals one target and three decoys, and shows only a fingerprint. Take a few quiet minutes, describe what comes, then lock it before you see any photos. Play as many trials as you like.</div><div class="row"><button onclick="begin()">Begin trial</button></div><div class="err" id="err"></div></div>';
    if(LAST){h+=lastCard();}
  } else if(a.status==='viewing'){
    if(RECEIPTS[a.id]===undefined)RECEIPTS[a.id]=a.commit;
    h='<div class="hero">Trial '+a.num+'</div><div class="card"><h2>Sealed. Now describe it.</h2><div class="mono">'+a.commit+'</div><div class="note" style="margin-top:8px">Shapes, colors, textures, motion, feelings. Do not reason it out.</div>'+
    '<textarea id="imp" maxlength="1500" placeholder="What do you perceive?">'+esc(a.impressions||'')+'</textarea><div class="note">Up to about 1500 characters. Locking is final and timestamped.</div>'+
    '<div class="row"><button onclick="lockIt()">Lock impressions</button><button class="ghost" onclick="abortIt()">Abort ('+S.abortLeft+' left)</button></div><div class="err" id="err"></div></div>';
  } else if(a.status==='locked'){
    h='<div class="hero">Locked.</div><div class="card"><h2>Trial '+a.num+'</h2><div class="note">Your description is sealed. Ready to see the four photos?</div><div class="row"><button onclick="revealIt()">Reveal photos</button></div><div class="err" id="err"></div></div>';
  } else if(a.status==='revealed'){
    PICK=null;
    h='<div class="hero">Pick the match.</div><div class="card"><h2>Trial '+a.num+'</h2><div class="note">You wrote: <i>'+esc(a.impressions||'(nothing)')+'</i></div><div class="grid">'+a.images.map(function(id){return '<div class="im" onclick="pickIt('+id+',this)"><img src="https://picsum.photos/id/'+id+'/400/300" loading="lazy"></div>'}).join('')+'</div><div class="row"><button id="jb" disabled onclick="judge()">Score it</button></div><div class="note" style="margin-top:8px">Left unscored for 2 hours, a revealed trial counts as a miss.</div><div class="err" id="err"></div></div>';
  }
  v.innerHTML=h+myCard();
}
function lastCard(){
  var t=LAST; if(!t.images)return '';
  return '<div class="card"><h2>Last trial: <span class="'+(t.hit?'hit':'miss')+'">'+(t.hit?'HIT':'miss')+'</span></h2><div class="grid">'+t.images.map(function(id){
    var c=(id===t.targetId)?'tgt':(id===t.pickId?'wrong':'');
    return '<div class="im '+c+'"><img src="https://picsum.photos/id/'+id+'/400/300">'+(id===t.targetId?'<span class="tag hit">TARGET</span>':(id===t.pickId?'<span class="tag miss">YOUR PICK</span>':''))+'</div>'}).join('')+'</div>'+
    '<div class="row"><button class="ghost" onclick="verify()">Verify the seal</button></div><div id="vout" class="note"></div></div>';
}
function begin(){call('beginTrial',[TOKEN],function(){LAST=null;refresh()})}
function lockIt(){call('lockImpressions',[TOKEN,S.active.id,$('imp').value],function(){refresh()})}
function revealIt(){call('revealTrial',[TOKEN,S.active.id],function(){refresh()})}
function abortIt(){call('abortTrial',[TOKEN,S.active.id],function(){refresh()})}
function pickIt(id,el){PICK=id;var ims=document.querySelectorAll('.grid .im');for(var i=0;i<ims.length;i++)ims[i].classList.remove('picked');el.classList.add('picked');$('jb').disabled=false}
function judge(){if(PICK==null)return;call('judgeTrial',[TOKEN,S.active.id,PICK],function(t){LAST=t;refresh()})}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(d){return Array.prototype.map.call(new Uint8Array(d),function(b){return ('0'+b.toString(16)).slice(-2)}).join('')})}
function verify(){var t=LAST;sha(t.salt+'|'+t.targetId+'|'+t.decoys.join(',')).then(function(h){var r=RECEIPTS[t.id],el=$('vout');
  if(r){el.textContent=(h===r)?'Verified against the fingerprint this tab recorded before you viewed.':'MISMATCH with the fingerprint shown before viewing.';el.className=(h===r)?'note hit':'note miss'}
  else{el.textContent=(h===t.commit)?'Consistent with the stored fingerprint (no receipt in this tab, reloads lose it).':'MISMATCH with stored fingerprint.';el.className=(h===t.commit)?'note hit':'note miss'}})}

/* ---- boards ---- */
function drawBoard(){
  var v=$('view'); if(!B){v.innerHTML='<div class="card note">Loading...</div>';return}
  var h='<div class="hero">Leaderboard</div><div class="sub">Ranked by evidence against luck, not hit rate. Two lucky guesses cannot top the board; a long record can. The figures hold even if you check every minute. They are not the probability that anyone has a real ability.</div>';
  if(!B.rows.length){return v.innerHTML=h+'<div class="card note">No scored trials yet. Be the first.</div>'}
  h+='<div class="card"><table class="lb">'+B.rows.map(function(r,i){
    var me=S&&r.handle.toLowerCase()===S.handle.toLowerCase();
    return '<tr class="'+(me?'me':'')+'"><td class="rk">'+(i+1)+'</td><td><div class="nm">'+esc(r.handle)+(me?' (you)':'')+'</div><div class="dim">'+r.h+' / '+r.n+' &middot; '+pct(r.h,r.n)+' &middot; luck '+r.expected.toFixed(1)+'</div>'+meter(r.logE)+'</td><td style="text-align:right"><div class="nm">'+odds(r.luck)+'</div><div class="dim">adj. '+odds(r.luckAdj)+'</div></td></tr>'}).join('')+'</table></div>'+
  '<div class="note" style="margin-top:12px">Top line: if that player were only guessing, the chance they would ever reach evidence this strong is at most 1 in X. "adj." covers the whole crowd: the chance that any player, in a crowd that keeps growing, ever looks this strong by luck is at most that, with earlier joiners weighted more (player number i is held to i x (i+1) times the bar). It is not the probability anyone has a real ability.</div>';
  v.innerHTML=h;
}
function drawAll(){
  var v=$('view'); if(!B){v.innerHTML='<div class="card note">Loading...</div>';return}
  var a=B.all, h='<div class="hero">Everyone, combined</div><div class="sub">Every scored trial from every player, pooled.</div>'+
  '<div class="card"><div class="stats"><div class="st"><b>'+B.players+'</b><span>players</span></div><div class="st"><b>'+a.n.toLocaleString()+'</b><span>trials</span></div><div class="st"><b>'+a.h.toLocaleString()+'</b><span>hits</span></div></div>'+
  '<div class="stats" style="margin-top:8px"><div class="st"><b>'+a.expected.toFixed(1)+'</b><span>hits by luck</span></div><div class="st"><b>'+pct(a.h,a.n)+'</b><span>hit rate</span></div><div class="st"><b>'+(a.h-a.expected>=0?'+':'')+(a.h-a.expected).toFixed(1)+'</b><span>vs luck</span></div></div>'+
  '<div class="note" style="margin-top:14px">Evidence against pure luck</div><div class="big">'+(a.n?odds(a.luck):'-')+'</div>'+meter(a.logE)+'</div>'+
  '<div class="note" style="margin-top:12px">Updated '+new Date(B.updated).toLocaleTimeString()+'. A single hot account cannot move this much; a crowd all drifting above 25% would.</div>';
  v.innerHTML=h;
}
function drawMe(){
  var v=$('view'), L=window._log;
  var h='<div class="hero">My log</div><div class="sub">Your trials as the server recorded them, private to you. Targets and salts are released after scoring so you can verify each seal.</div>';
  if(!L)return v.innerHTML=h+'<div class="card note">Loading...</div>';
  h+='<div class="card"><div class="row" style="margin-top:0"><button class="ghost" onclick="showRaw()">Show raw JSON</button><button class="ghost" onclick="rotate()">Rotate recovery key</button></div><div class="note" style="margin-top:8px">Think someone saw your key? Rotating gives you a new key, the old key stops working, and every other device is signed out.</div><pre id="raw" class="hid"></pre></div>';
  h+=L.trials.slice().reverse().map(function(t){return '<div class="card"><div><span class="pill">#'+t.num+'</span><span class="pill">'+t.status+(t.expired?' (timed out)':'')+'</span>'+(t.status==='judged'?'<b class="'+(t.hit?'hit':'miss')+'">'+(t.hit?'HIT':'miss')+'</b>':'')+'</div>'+(t.impressions?'<div class="note" style="margin-top:8px">'+esc(t.impressions)+'</div>':'')+'<div class="mono" style="margin-top:6px">'+t.commit+'</div></div>'}).join('');
  v.innerHTML=h;
}
function showRaw(){var p=$('raw');p.className='';p.textContent=JSON.stringify(window._log,null,2)}
function drawAbout(){
  $('view').innerHTML='<div class="hero">How it works</div>'+
  '<div class="card"><h2>One trial</h2><div class="note">1. The server picks a target and three decoys, seals them with a fingerprint (SHA-256), and shows you only the fingerprint.<br>2. You describe what you perceive and lock it, timestamped.<br>3. Only then do you see the four photos and pick one.<br>4. The server scores you, then releases the salt and decoys so you can check the fingerprint never changed.</div></div>'+
  '<div class="card"><h2>How scores work</h2><div class="note">Luck gives 25%. Each player gets a running evidence score against pure luck (a mixture likelihood ratio over every hit rate from 25% to 100%). "1 in X" means: if you were only guessing, the chance you would ever reach evidence this strong is at most 1 in X. That holds however often anyone looks and whenever you stop, so you can watch live and play as long as you like. It is not the probability that you have a real ability, and it only tests for beating 25%, not scoring below it. The "adj." figure extends the same guarantee to the whole crowd, including players who have not joined yet, by holding the i-th player to i x (i+1) times the bar.</div></div>'+
  '<div class="card"><h2>Rules that keep it honest</h2><div class="note">Aborts only before the photos are shown, with an allowance that grows with trials played, and they are counted. A revealed trial left unscored for 2 hours counts as a miss. A trial locked but not revealed for 48 hours is closed as an abort. Each pick is scored once. Your impressions and the targets are never shown to other players. The leaderboard shows only name and counts.</div></div>'+
  '<div class="card"><h2>Data</h2><div class="note">We store your player name, a scrambled copy of your recovery key, and your trials and impressions, in the owner\'s Google account. No email. Photos load from a third-party image service, which sees your IP address.</div></div>'+
  '<div class="card"><h2>What this does not prove</h2><div class="note">The site runs in the owner\'s Google account. The owner can open the backend, read sealed targets, change records or edit the code, and nobody can independently prove otherwise, so the owner\'s own results are unwitnessed. People can make extra accounts; the adjusted figure covers that for rankings, but the pooled Everyone numbers can be inflated that way. Photos are not snapshotted. This is a fun, checkable arena, not courtroom proof. Treat a striking score as a reason for a properly witnessed replication.</div></div>';
}

(function(){ TOKEN=load('rv_t'); if(TOKEN) boot(); else authView(); })();
</script></body></html>
